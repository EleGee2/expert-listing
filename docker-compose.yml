services:
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_NAME: expert-listing
      PORT: 3000
      API_PREFIX: api
      API_VERSION: 1
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      DATABASE_URL: postgresql://expert:expert_password@postgres:5432/expert_listing?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_TLS: false
      JWT_ACCESS_SECRET: local-compose-access-secret-change-me
      JWT_REFRESH_SECRET: local-compose-refresh-secret-change-me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: local-compose-webhook-secret-change-me
      RATE_LIMIT_TTL_MS: 60000
      RATE_LIMIT_LIMIT: 120
      AUTH_RATE_LIMIT_TTL_MS: 60000
      AUTH_RATE_LIMIT_LIMIT: 10
    ports:
      - "3001:3000"
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: expert
      POSTGRES_PASSWORD: expert_password
      POSTGRES_DB: expert_listing
    ports:
      - "55433:5432"
    volumes:
      - expert_listing_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expert -d expert_listing"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "56380:6379"
    volumes:
      - expert_listing_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  expert_listing_postgres:
  expert_listing_redis:
